# Default values for the optional heart config keys, read by main.go at deploy time.
#
# A per-stack override always wins:  pulumi config set heart:<key> <value>
# Edit a value here to change the default for every release that doesn't override it.
#
# NOT listed here (required per stack, no default): release, project-name, influx-token.
# Counts are quoted so they parse as strings, matching how Pulumi stores config.

holochain-version: holochain-0.6.2-rc.0
holo-keyutil-version: v0.1.0

# Network identity. Override per release for an isolated network (and remember the
# DNA network seed is applied at .happ install time, not here).
bootstrap-url: https://hc-auth-iroh-unyt.holochain.org/
signal-url: http://not-used:1234
relay-url: https://iroh-relay-unyt.holochain.org
auth-server: https://hc-auth-iroh-unyt.holochain.org

# Metrics go to the self-hosted InfluxDB (wind-tunnel/influx/ on the ifdb host).
# Defaults to the shared "unyt" bucket. To isolate a release's metrics, override
# heart:influx-bucket per stack with a bucket that already exists on the instance
# (this program does not create buckets — `influx bucket create` there first).
influx-url: https://ifdb.holochain.org
influx-org: holo
influx-bucket: unyt

# Droplet sizes (DigitalOcean slugs).
progenitor-size: s-2vcpu-4gb
always-online-size: s-2vcpu-4gb
bridging-size: s-4vcpu-8gb
hf-swapper-size: s-2vcpu-4gb
hash-explorer-size: s-2vcpu-4gb
notary-size: s-2vcpu-4gb
wt-log-harvester-size: s-2vcpu-4gb

# Node counts. progenitor, blockchain-bridging and unyt-bridging are capped at 1.
#
# progenitor defaults to 1: every release needs its network creator, deployed
# first, on its own droplet (it produces the network_seed + progenitor_pubkey
# every other node reads from automation/config/release.json). See
# heart/doc/setup-progenitor.md.
#
# Disabled roles default to 0: the service nodes each run a full conductor +
# agent, so dedicated always-online peers add nothing, and unyt-bridging never
# took on its intended bridging duty. Their automation configs are parked in
# automation/config/disabled/ — re-enabling a role means raising its count here
# (or per stack) AND restoring that config dir + its Makefile targets.
progenitor-count: "1"
always-online-count: "0"   # was "2"
blockchain-bridging-count: "1"
unyt-bridging-count: "0"   # was "1"
hf-swapper-count: "1"
hash-explorer-count: "1"
notary-count: "1"  # was "2" — single-notary policy for now; raise per release when a window needs resilience (notary-2's config is parked too)

# Wind-tunnel sub-fleet (proof-of-service pipeline — automation/config/wt-log-harvester/,
# wt-hf-pipeline/OPS.md). Only the harvester is a provisioned node; the sub-fleet's
# other agents (wt lane manager, wt treasury) are laptop-resident external members,
# allow-listed via external_agents in the wt-log-harvester automation config.
wt-log-harvester-count: "1"
