name: Go

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this job builds and tests, it never writes to the repo or its
# packages. Actions are pinned to immutable commit SHAs so a retagged v4/v5
# cannot change what runs here.
permissions:
  contents: read

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here talks to the remote after checkout, so leave no
          # credential in .git/config for a later step to reach.
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # Includes TestCloudInitTreeIsASCII, the only check that sees non-ASCII in
      # cloudinit/base/ - those files are base64-encoded before injection, so the
      # deploy-time guard in renderCloudInit structurally cannot catch them.
      - name: Test
        run: go test ./...
