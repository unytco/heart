name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # Includes TestCloudInitTreeIsASCII, the only check that sees non-ASCII in
      # cloudinit/base/ - those files are base64-encoded before injection, so the
      # deploy-time guard in renderCloudInit structurally cannot catch them.
      - name: Test
        run: go test ./...
